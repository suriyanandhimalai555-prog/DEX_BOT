name: Build Pipeline

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BACKEND BUILD
  # ============================================================

  build-backend:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64

          tags: |
            ghcr.io/${{ github.repository_owner }}/dex-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dex-backend:latest

          cache-from: type=gha,scope=dex-backend
          cache-to: type=gha,mode=max,scope=dex-backend

      - name: Backend Build Information
        run: |
          echo "================================="
          echo "BACKEND BUILD SUCCESSFUL"
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/dex-backend:${{ github.sha }}"
          echo "================================="


  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  build-frontend:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64

          tags: |
            ghcr.io/${{ github.repository_owner }}/dex-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dex-frontend:latest

          cache-from: type=gha,scope=dex-frontend
          cache-to: type=gha,mode=max,scope=dex-frontend

      - name: Frontend Build Information
        run: |
          echo "================================="
          echo "FRONTEND BUILD SUCCESSFUL"
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/dex-frontend:${{ github.sha }}"
          echo "================================="
