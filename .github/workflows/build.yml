name: Build Pipeline


on:
  push:
    branches:
      - main
      - master



permissions:
  contents: read
  packages: write



jobs:

  build-and-push:


    runs-on: ubuntu-latest



    steps:


    #################################
    # Checkout Code
    #################################

    - name: Checkout Repository

      uses: actions/checkout@v4




    #################################
    # Login GHCR
    #################################

    - name: Login to GHCR

      uses: docker/login-action@v3

      with:

        registry: ghcr.io

        username: ${{ github.actor }}

        password: ${{ secrets.GITHUB_TOKEN }}





    #################################
    # Setup Docker Buildx
    #################################

    - name: Setup Docker Buildx

      uses: docker/setup-buildx-action@v3





    #################################
    # Backend Image Build
    #################################

    - name: Build and Push Backend Image

      uses: docker/build-push-action@v6


      with:

        context: ./backend

        push: true
        platforms: linux/arm64


        tags: |

          ghcr.io/${{ github.repository_owner }}/dex-backend:${{ github.sha }}

          ghcr.io/${{ github.repository_owner }}/dex-backend:latest



        cache-from:

          type=gha


        cache-to:

          type=gha,mode=max






    #################################
    # Frontend Image Build
    #################################

    - name: Build and Push Frontend Image

      uses: docker/build-push-action@v6


      with:

        context: ./frontend

        push: true
        platforms: linux/arm64


        tags: |

          ghcr.io/${{ github.repository_owner }}/dex-frontend:${{ github.sha }}

          ghcr.io/${{ github.repository_owner }}/dex-frontend:latest



        cache-from:

          type=gha


        cache-to:

          type=gha,mode=max






    #################################
    # Build Summary
    #################################

    - name: Build Information

      run: |

        echo "================================="

        echo "Docker Images Built Successfully"

        echo "Repository: ${{ github.repository }}"

        echo "Branch: ${{ github.ref_name }}"

        echo "Commit SHA: ${{ github.sha }}"

        echo "Backend Image:"

        echo "ghcr.io/${{ github.repository_owner }}/dex-backend:${{ github.sha }}"

        echo "Frontend Image:"

        echo "ghcr.io/${{ github.repository_owner }}/dex-frontend:${{ github.sha }}"

        echo "================================="
