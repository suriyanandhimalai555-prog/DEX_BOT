services:
  # Local Postgres only. Production/k8s uses DATABASE_URL in dexbot-secret
  # (external Postgres). When this API container uses compose Postgres, set
  # DATABASE_URL=postgresql://dexbot:dexbot@postgres:5432/dexbot in backend/.env.

  postgres:
    image: postgres:16-alpine
    container_name: dex-postgres
    restart: always
    environment:
      POSTGRES_USER: dexbot
      POSTGRES_PASSWORD: dexbot
      POSTGRES_DB: dexbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexbot -d dexbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  dex-backend:
    image: ghcr.io/suriyanandhimalai555-prog/dex-backend:latest
    container_name: dex-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: dex-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"

  dex-worker:
    image: ghcr.io/suriyanandhimalai555-prog/dex-backend:latest
    container_name: dex-worker
    env_file:
      - ./backend/.env
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dex-backend:
        condition: service_started
    command: npm run worker:execution

  dex-frontend:
    image: ghcr.io/suriyanandhimalai555-prog/dex-frontend:latest
    container_name: dex-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - dex-backend

volumes:
  postgres_data:
