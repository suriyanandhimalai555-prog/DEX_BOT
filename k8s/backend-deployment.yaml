apiVersion: apps/v1
kind: Deployment

metadata:
  name: dex-backend
  namespace: dexbot

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: dex-backend

  template:
    metadata:
      labels:
        app: dex-backend

    spec:
      containers:

      - name: dex-backend

        image: ghcr.io/suriyanandhimalai555-prog/dex-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 4000

        envFrom:
        - secretRef:
            name: dexbot-secret


        # Application health check
        readinessProbe:
          httpGet:
            path: /health
            port: 4000

          # Wait before first check
          initialDelaySeconds: 10

          # Check every 5 seconds
          periodSeconds: 5

          # API timeout
          timeoutSeconds: 3

          # Fail after 3 attempts
          failureThreshold: 3


        # Container restart check
        livenessProbe:
          httpGet:
            path: /health
            port: 4000

          # Wait 30 seconds after startup
          initialDelaySeconds: 30

          # Check every 10 seconds
          periodSeconds: 10

          timeoutSeconds: 3

          failureThreshold: 3
