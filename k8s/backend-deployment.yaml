apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-backend
  namespace: dexbot
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dex-backend
  template:
    metadata:
      labels:
        app: dex-backend
    spec:
      containers:
      - name: dex-backend
        image: ghcr.io/suriyanandhimalai555-prog/dex-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: dexbot-secret
        readinessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
