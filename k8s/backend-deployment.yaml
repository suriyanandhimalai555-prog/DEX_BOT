apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-backend
  namespace: dexbot

spec:
  replicas: 1

  revisionHistoryLimit: 10

  minReadySeconds: 10

  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: dex-backend

  template:
    metadata:
      labels:
        app: dex-backend

    spec:
      containers:
        - name: dex-backend

          image: ghcr.io/suriyanandhimalai555-prog/dex-backend:arm64

          imagePullPolicy: Always

          ports:
            - containerPort: 4000
              protocol: TCP

          envFrom:
            - secretRef:
                name: dexbot-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

      imagePullSecrets:
        - name: ghcr-secret
